theme: jekyll-theme-minimal
title: "Duty Without Data"
description: "Why disability fair-housing rights fail without records — and the ready-to-adapt Section 553(e) petition asking HUD to fix it."
url: "https://nickgillarizona.github.io"
baseurl: "/Duty-Without-Data"
logo: false
show_downloads: false
comment_window_deadline: "2026-08-11"
comment_window_active: false
# The site renders through the local layout (_layouts/default.html) and
# stylesheet (assets/css/site.css); no JavaScript anywhere. The six content
# pages live in _pages/ (underscore directories need the include below).
include:
  - _pages
# Repository documents outside the site's scope are linked by absolute GitHub
# URLs. The directories below are excluded from the Jekyll build.
exclude:
  - action/
  - article/appendices/
  - data/
  - manuscript/
  - record/hud-27061/
  - method/pipeline/
  - method/preregistration/
  - replication/
  - method/prompts/
  - results/
  - scripts/
  - supplementary/
  - method/validation_three_model/
  - method/validation_four_coder_full/
  - method/validation_kimi_k2_6/
