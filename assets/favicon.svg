  <rect x="7" y="9" width="18" height="3" rx="1.5" fill="#fbfaf7"/>
  <rect x="7" y="15" width="18" height="3" rx="1.5" fill="#fbfaf7"/>
  <rect x="7" y="21" width="7" height="3" rx="1.5" fill="#fbfaf7"/>
  <rect x="19" y="21" width="6" height="3" rx="1.5" fill="#9a4f35" opacity="0.85"/>
</svg>
